<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Константин — Junior IT (QA / Backend / Web)</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>

<body>
  <header class="topbar">
    <div class="wrap topbar__inner">
      <div class="brand">
        <div class="brand__avatar" aria-hidden="true">IT</div>
        <div class="brand__text">
          <div class="brand__name" id="nameTop">Константин</div>
          <div class="brand__role" id="roleTop">Junior IT (QA / Backend / Web)</div>
        </div>
      </div>

      <div class="topbar__center">
        <span class="topbar__title">Портфолио</span>
      </div>

      <div class="topbar__spacer"></div>
    </div>
  </header>

  <main class="wrap main" role="main">
    <div class="callout" id="dataStatus" hidden></div>

    <div class="tiles" id="tilesGrid">
      <a class="tile tile--active" href="about/">
        <span class="tile__icon"><span class="icon icon--profile" aria-hidden="true"></span></span>
        <span class="tile__label">Обо мне</span>
      </a>

      <a class="tile tile--active" href="cases/" id="tilesCases">
        <span class="tile__icon"><span class="icon icon--cases" aria-hidden="true"></span></span>
        <span class="tile__label">Кейсы тестирования</span>
        <span class="tile__count" id="casesCount"></span>
      </a>

      <a class="tile tile--active" href="tools/" id="tilesTools">
        <span class="tile__icon"><span class="icon icon--tools" aria-hidden="true"></span></span>
        <span class="tile__label">Инструменты</span>
        <span class="tile__count" id="toolsCount"></span>
      </a>

      <a class="tile tile--active" href="checklists/" id="tilesChecklists">
        <span class="tile__icon"><span class="icon icon--check" aria-hidden="true"></span></span>
        <span class="tile__label">Чек-листы</span>
      </a>

      <a class="tile tile--active" href="test-plans/" id="tilesTestPlans">
        <span class="tile__icon"><span class="icon icon--plan" aria-hidden="true"></span></span>
        <span class="tile__label">Тест-планы</span>
      </a>

      <a class="tile tile--active" href="contacts/">
        <span class="tile__icon"><span class="icon icon--contact" aria-hidden="true"></span></span>
        <span class="tile__label">Контакты</span>
      </a>
    </div>
  </main>

  <footer class="footer" role="contentinfo">
    <div class="wrap footer__inner">
      <div>&copy; <span id="year"></span> <span id="nameFooter">Константин</span></div>
      <div class="muted">v.3.0.0</div>
    </div>
  </footer>

  <div id="toast" class="toast" hidden role="status" aria-live="polite">Готово</div>

  <script src="assets/app.js" defer></script>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Кейсы тестирования — Константин</title>
  <link rel="stylesheet" href="../assets/style.css" />
</head>

<body>
  <header class="topbar">
    <div class="wrap topbar__inner">
      <div class="brand">
        <a class="brand__avatar brand__avatar--link" href="../" aria-label="На главную">IT</a>
        <div class="brand__text">
          <div class="brand__name" id="nameTop">Константин</div>
          <div class="brand__role" id="roleTop">Junior IT (QA / Backend / Web)</div>
        </div>
      </div>

      <div class="topbar__center">
        <span class="topbar__title">Кейсы тестирования</span>
      </div>

      <div class="topbar__spacer"></div>
    </div>
  </header>

  <main class="wrap main main--cases" role="main">
    <section class="section">
      <div class="section__head">
        <a class="back-link" href="../">&larr; На главную</a>
        <h1>Кейсы тестирования</h1>
        <p class="muted">Выберите категорию, чтобы посмотреть кейсы и баг-репорты.</p>
      </div>

      <div class="catTiles" id="catTiles">
        <button class="catTile catTile--active" data-category="ios" type="button">
          <span class="catTile__icon"><span class="icon icon--all" aria-hidden="true"></span></span>
          <span class="catTile__label">iOS</span>
        </button>
        <button class="catTile catTile--active" data-category="sites" type="button">
          <span class="catTile__icon"><span class="icon icon--web" aria-hidden="true"></span></span>
          <span class="catTile__label">Сайты</span>
        </button>
        <button class="catTile catTile--active" data-category="games" type="button">
          <span class="catTile__icon"><span class="icon icon--game" aria-hidden="true"></span></span>
          <span class="catTile__label">Игры</span>
        </button>
        <button class="catTile catTile--disabled" disabled type="button">
          <span class="catTile__icon"><span class="icon icon--integration" aria-hidden="true"></span></span>
          <span class="catTile__label">API</span>
          <span class="catTile__badge">В разработке</span>
        </button>
        <button class="catTile catTile--disabled" disabled type="button">
          <span class="catTile__icon"><span class="icon icon--ai" aria-hidden="true"></span></span>
          <span class="catTile__label">Автотесты</span>
          <span class="catTile__badge">В разработке</span>
        </button>
        <button class="catTile catTile--disabled" disabled type="button">
          <span class="catTile__icon"><span class="icon icon--archive" aria-hidden="true"></span></span>
          <span class="catTile__label">Прочее</span>
          <span class="catTile__badge">В разработке</span>
        </button>
      </div>

      <div class="callout" id="dataStatus" hidden></div>
      <div class="casesEmpty callout" id="casesEmpty" hidden>В этой категории пока нет кейсов.</div>
      <div class="cases" id="casesList"></div>
    </section>
  </main>

  <footer class="footer" role="contentinfo">
    <div class="wrap footer__inner">
      <div>&copy; <span id="year"></span> <span id="nameFooter">Константин</span></div>
      <div class="muted">v.3.0.0</div>
    </div>
  </footer>

  <div id="toast" class="toast" hidden role="status" aria-live="polite">Готово</div>

  <script src="../assets/app.js" defer></script>
</body>
</html>
